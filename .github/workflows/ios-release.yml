name: FixEase iOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - debug

permissions:
  contents: read

jobs:
  ios-release:
    name: Build iPhone release IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter stable 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Show build tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Check production backend health
        run: curl --fail --silent --show-error --max-time 20 https://api.fixease.oraik.co/health

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build optimized iPhone app
        run: flutter build ios --release --no-codesign --no-pub --dart-define=FIXEASE_DEMO_MODE=true

      - name: Package unsigned IPA for Apple ID signing
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"
          IPA_PATH="$IPA_DIR/FixEase-ios-release-unsigned.ipa"

          test -d "$APP_PATH"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent "$IPA_DIR/Payload" "$IPA_PATH"
          test -s "$IPA_PATH"
          echo "Created $IPA_PATH"

      - name: Upload iOS release IPA
        uses: actions/upload-artifact@v4
        with:
          name: FixEase-ios-release-${{ github.run_number }}
          path: build/ios/ipa/FixEase-ios-release-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
